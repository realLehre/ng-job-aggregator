<div
  class="bg-[#D7D6D6] font-mono text-xs border-2 border-[#201A23] shadow-2xl flex flex-col max-h-[90vh]"
>
  <!-- Header -->
  <div
    class="bg-[#201A23] text-[#D7D6D6] p-4 md:p-6 flex items-center justify-between border-b border-[#201A23]"
  >
    <div class="flex items-center gap-3">
      <div class="p-2 bg-amber-400 text-[#201A23] font-bold">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          ></path>
        </svg>
      </div>
      <div>
        <h3 class="text-lg font-bold leading-[20px] pb-2 uppercase tracking-wider">
          AI Resume Compatibility Analyzer
        </h3>
        <p class="text-[12px] opacity-80">
          Evaluating fit for:
          <span class="text-amber-300 font-bold">{{ job?.title || 'Position' }}</span>
        </p>
      </div>
    </div>
  </div>

  <!-- Dialog Body (Scrollable) -->
  <mat-dialog-content class="p-6 md:p-8 space-y-6 overflow-y-auto max-h-[70vh]">
    <!-- Resume Upload Section -->
    <app-resume-upload />

    <!-- AI Analysis Action Button -->
    @if (
      analysisService.selectedFile() &&
      !analysisService.isAnalyzing() &&
      !analysisService.analysisResult()
    ) {
      <div class="mt-3">
        <button
          type="button"
          (click)="analysisService.runAnalysis(job)"
          class="w-full bg-[#201A23] hover:bg-[#4A434F] text-[#D7D6D6] font-bold py-3.5 px-4 text-center flex items-center justify-center gap-2 transition-colors shadow-lg tracking-wider text-xs cursor-pointer"
        >
          RUN AI ANALYSIS &rarr;
        </button>
      </div>
    }

    <!-- AI Loader -->
    @if (analysisService.isAnalyzing()) {
      <app-analysis-loader />
    }

    <!-- Analysis Results -->
    @if (analysisService.analysisResult()) {
      <app-analysis-results />
    }
  </mat-dialog-content>

  <!-- Dialog Footer -->
  <mat-dialog-actions class="bg-[#201A23]/10 p-4 border-t border-[#201A23]/20 flex justify-end">
    <button
      type="button"
      (click)="closeDialog()"
      class="bg-[#201A23] hover:bg-[#4A434F] text-[#D7D6D6] px-4 py-2 text-xs font-bold transition-colors cursor-pointer"
    >
      CLOSE DIALOG
    </button>
  </mat-dialog-actions>
</div>
