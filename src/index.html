<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobAggregator</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#D7D6D6] text-[#201A23]">
    <app-root>
      <div
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #d7d6d6;
          color: #201a23;
          font-family: monospace;
          padding: 24px;
        "
      >
        <div
          style="
            max-width: 400px;
            width: 100%;
            border-left: 4px solid #201a23;
            background: rgba(32, 26, 35, 0.05);
            padding: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
          "
        >
          <h1
            style="
              font-size: 20px;
              font-weight: 900;
              font-family: 'Space Grotesk', sans-serif;
              margin-bottom: 12px;
              letter-spacing: -0.02em;
            "
          >
            JOB_AGGREGATOR
          </h1>
          <p style="font-size: 11px; opacity: 0.8; margin-bottom: 20px; line-height: 1.5">
            Loading core modules and establishing connection to global career registries...
          </p>
          <div
            style="
              width: 100%;
              height: 4px;
              background: rgba(32, 26, 35, 0.1);
              overflow: hidden;
              position: relative;
            "
          >
            <div
              style="
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 40%;
                background: #201a23;
                animation: shimmer 1.5s infinite linear;
              "
            ></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes shimmer {
          0% {
            transform: translateX(-100%);
          }
          100% {
            transform: translateX(350%);
          }
        }
      </style>
    </app-root>
  </body>
</html>
